name: tests

on:
  push:
    branches:
      - '*'
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v5

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
           dotnet-version: 10.0.x

      # Perform unit tests
      - name: Perform unit tests
        run: dotnet test IPAddressRange.Test -l "console;verbosity=normal" --nologo

